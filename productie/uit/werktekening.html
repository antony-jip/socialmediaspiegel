="klein" text-anchor="start">schaal 1:10</text><rect x="118.00" y="42.00" width="60.00" height="120.00" rx="7.20" class="onzicht" /><rect x="128.00" y="50.00" width="40.00" height="3.00" rx="0.20" class="koker" /><circle cx="128.0" cy="152.0" r="1.5" class="koker"/><circle cx="168.0" cy="152.0" r="1.5" class="koker"/><text x="118.00" y="168.00" class="klein" text-anchor="start">Rail en nokjes verlijmen met de bovenplaat-nokken als aanslag.</text><text x="118.00" y="171.50" class="klein" text-anchor="start">Klant: muurrail met waterpasje, 2 schroeven, spiegel erop, klaar.</text><text x="118.00" y="178.00" class="klein" text-anchor="start">Varianten: ophangrail (standaard) of plak-klaar (stuklijst 8).</text><text x="290.00" y="30.00" class="kop" text-anchor="start">Werkvolgorde</text><text x="290.00" y="42.00" class="t" text-anchor="start">1</text><text x="296.00" y="42.00" class="t" text-anchor="start">Folie printen, lamineren en op de 4 mm plaat zetten.</text><text x="290.00" y="49.00" class="t" text-anchor="start">2</text><text x="296.00" y="49.00" class="t" text-anchor="start">Frezen: onderplaat contour, bovenplaat contour + venster</text><text x="296.00" y="54.00" class="t" text-anchor="start">door de folie heen. Venster met Ø 3 mm, niet dikker.</text><text x="290.00" y="61.00" class="t" text-anchor="start">3</text><text x="296.00" y="61.00" class="t" text-anchor="start">Onderplaat tegen de nokken, bovenplaat erop met VHB,</text><text x="296.00" y="66.00" class="t" text-anchor="start">randen gelijk tegen dezelfde nokken.</text><text x="290.00" y="73.00" class="t" text-anchor="start">4</text><text x="296.00" y="73.00" class="t" text-anchor="start">Spiegel in het venster: VHB-stroken + verticale rupsen</text><text x="296.00" y="78.00" class="t" text-anchor="start">spiegelkit, niet vol-vlaks. Voorvlak gelijk met folie.</text><text x="290.00" y="85.00" class="t" text-anchor="start">5</text><text x="296.00" y="85.00" class="t" text-anchor="start">Omdraaien, spiegeldeel van de rail bovenaan en 2 nokjes</text><text x="296.00" y="90.00" class="t" text-anchor="start">onderaan verlijmen (maten achteraanzicht).</text><text x="290.00" y="97.00" class="t" text-anchor="start">6</text><text x="296.00" y="97.00" class="t" text-anchor="start">Rubber U-profiel om de buitenrand klemmen: start en eind</text><text x="296.00" y="102.00" class="t" text-anchor="start">onderaan in het midden, naad met een druppel kit.</text><text x="290.00" y="109.00" class="t" text-anchor="start">7</text><text x="296.00" y="109.00" class="t" text-anchor="start">24 uur laten uitharden voor transport.</text><text x="290.00" y="116.00" class="t" text-anchor="start">8</text><text x="296.00" y="116.00" class="t" text-anchor="start">Bij licht: COB-strip rondom op achterkant, 15 mm uit de rand,</text><text x="296.00" y="121.00" class="t" text-anchor="start">hoeken doorverbinden, kabel onderaan in het midden.</text><text x="290.00" y="128.00" class="t" text-anchor="start">9</text><text x="296.00" y="128.00" class="t" text-anchor="start">Bij licht: test in donkere ruimte op 40 mm van een witte</text><text x="296.00" y="133.00" class="t" text-anchor="start">wand: gloed gelijkmatig, hoeken zonder gat in de gloed.</text><text x="290.00" y="140.00" class="t" text-anchor="start">10</text><text x="296.00" y="140.00" class="t" text-anchor="start">Verpakken met hoekbeschermers + muurrail, schroeven,</text><text x="296.00" y="145.00" class="t" text-anchor="start">pluggen, boortje en borgschroef. Plak-klaar: tape erop.</text><text x="290.00" y="162.00" class="kop" text-anchor="start">Nog te beslissen</text><text x="290.00" y="169.00" class="t" text-anchor="start">Railprofiel kiezen: Z-profiel met 40 mm totale diepte.</text><text x="290.00" y="174.00" class="t" text-anchor="start">Hoekverbinding strip: connector of solderen.</text><text x="290.00" y="179.00" class="t" text-anchor="start">Leverancier glas + folie: kit laten vrijgeven.</text><text x="290.00" y="184.00" class="t" text-anchor="start">Rand: rubber zwart (standaard) of lakken, op het proefstuk kiezen.</text><text x="290.00" y="189.00" class="t" text-anchor="start">Proefstuk: lichtbeeld op 40 mm, zo nodig 50 mm diep.</text><rect x="232" y="255" width="178" height="32" class="kader"/><text x="235.00" y="262.00" class="klein" text-anchor="start">Project</text><text x="262.00" y="262.00" class="t" text-anchor="start">Socialmediaspiegel · telefoonvorm 60 × 120 cm</text><text x="235.00" y="269.30" class="klein" text-anchor="start">Blad</text><text x="262.00" y="269.30" class="t" text-anchor="start">2 van 2 · mallen en werkvolgorde</text><line x1="232" y1="264.3" x2="410" y2="264.3" class="dun"/><text x="235.00" y="276.60" class="klein" text-anchor="start">Maateenheid</text><text x="262.00" y="276.60" class="t" text-anchor="start">mm, tenzij anders vermeld</text><line x1="232" y1="271.6" x2="410" y2="271.6" class="dun"/><text x="235.00" y="283.90" class="klein" text-anchor="start">Getekend</text><text x="262.00" y="283.90" class="t" text-anchor="start">Sign Company · 27-09-2026 · concept, niet vrijgegeven</text><line x1="232" y1="278.9" x2="410" y2="278.9" class="dun"/></svg>
